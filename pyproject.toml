[project]
name = "muse-glimmer-diffusion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.31.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "vllm>=0.29.0",
    "wandb>=0.30.0",
]

[project.entry-points."vllm.general_plugins"]
entropy_logging = "muse_glimmer.entropy_plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muse_glimmer"]
